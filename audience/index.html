<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MCP Color</title>
  <style>
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      background-color: #111;
      color: rgba(255, 255, 255, 0.7);
      transition: background-color 600ms ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body.flashing { transition: background-color 60ms ease; }
    body.flash { background-color: #d93025 !important; }

    #status {
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    #card {
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
      padding: 30px 38px 26px;
      border-radius: 26px;
      text-align: center;
      color: #fff;
      max-width: 86vw;
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 380ms ease, transform 380ms ease;
    }
    #card.ready { opacity: 1; transform: translateY(0); }
    #welcome {
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1.35;
      margin: 0 0 16px 0;
      opacity: 0.95;
    }
    #lang {
      font-size: 44px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin: 0 0 12px 0;
    }
    #hsl {
      font-size: 11px;
      font-family: ui-monospace, Menlo, monospace;
      letter-spacing: 0.04em;
      opacity: 0.65;
    }

    #debug {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      font-size: 11px;
      font-family: ui-monospace, Menlo, monospace;
      opacity: 0.4;
      text-align: center;
      color: #fff;
    }
    body:not(.show-debug) #debug { display: none; }
  </style>
</head>
<body>
  <div id="status">loading…</div>
  <div id="card">
    <div id="welcome"></div>
    <div id="lang"></div>
    <div id="hsl"></div>
  </div>
  <div id="debug"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('debug') === '1') document.body.classList.add('show-debug');

    const $status  = document.getElementById('status');
    const $card    = document.getElementById('card');
    const $welcome = document.getElementById('welcome');
    const $lang    = document.getElementById('lang');
    const $hsl     = document.getElementById('hsl');
    const $debug   = document.getElementById('debug');

    const WELCOME = {
      rust:       "Welcome to the Rust regime.",
      python:     "Welcome to the Python world.",
      typescript: "Welcome to TypeScript territory.",
      javascript: "Welcome to TypeScript territory.",
    };

    function getOrMakeSession() {
      let id = localStorage.getItem('mcp-session-id');
      if (!id) {
        id = (crypto.randomUUID && crypto.randomUUID()) ||
             Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('mcp-session-id', id);
      }
      return id;
    }

    async function fetchColor(seed) {
      const resp = await fetch('/color', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seed }),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return resp.json();
    }

    function flashRed() {
      document.body.classList.add('flashing');
      const once = (i) => {
        document.body.classList.add('flash');
        setTimeout(() => {
          document.body.classList.remove('flash');
          if (i < 2) {
            setTimeout(() => once(i + 1), 130);
          } else {
            setTimeout(() => document.body.classList.remove('flashing'), 220);
          }
        }, 200);
      };
      once(0);
    }
    window.flashRed = flashRed;

    function connectEvents() {
      const es = new EventSource('/events');
      es.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.event === 'flash') flashRed();
        } catch (_) { /* ignore */ }
      };
      es.onerror = () => { /* EventSource auto-reconnects */ };
    }

    async function paintMe() {
      const session = getOrMakeSession();
      $debug.textContent = `session ${session.slice(0, 8)}… → calling /color…`;
      try {
        const color = await fetchColor(session);
        document.body.style.backgroundColor = color.hsl;
        $status.textContent = '';
        $welcome.textContent = WELCOME[color.language] || `Welcome — ${color.language}.`;
        $lang.textContent    = color.language;
        $hsl.textContent     = color.hsl;
        $card.classList.add('ready');
        $debug.textContent = `${color.language} (${color.routed_to}) · ${color.hsl} · session ${session.slice(0, 8)}…`;
      } catch (e) {
        $status.textContent = 'error';
        $debug.textContent = String(e.message || e);
      }
    }

    paintMe();
    connectEvents();
  </script>
</body>
</html>
